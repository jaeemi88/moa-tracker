<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>   — </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<meta name="theme-color" content="#FFFFFF">
<style>
  :root{
    --white:#FFFFFF;
    --teal:#3D4500;
    --teal-light:#EAF2AE;
    --paper:#F6F7F5;
    --line:#E3E6E2;
    --ink:#20241F;
    --muted:#6B756B;
    --warn:#B45309;
    --warn-bg:#FEF3E2;
    --amber:#C0D904;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Noto Sans KR","Malgun Gothic"," ",-apple-system,sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    line-height:1.6;
    word-break:keep-all;
    overflow-wrap:break-word;
  }
  header{
    background:#C0D904;
    color:#3D4500;
    padding:18px 20px 16px;
  }
  header .brand{font-size:12px;color:#5A6400;margin-bottom:4px;display:flex;align-items:center;gap:5px;}
  header .brand .brand-logo{width:14px;height:14px;flex-shrink:0;} /* :    (#3D4500)  */
  header .brand .brand-name{color:#3D4500;font-weight:700;}
  header .title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  header h1{font-size:20px;margin:0;font-weight:600;}
  header .role-badge{
    font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;
    background:#3D4500;color:#EAF2AE;flex-shrink:0;
  }
  main{max-width:720px;margin:0 auto;padding:18px 16px 60px;width:100%;flex:1;}
  .lead{color:var(--muted);font-size:13px;margin:4px 0 18px;}
  .back-btn{background:none;border:none;color:var(--teal);font-size:13px;cursor:pointer;padding:6px 0;margin-bottom:6px;}

  .top-cards{display:flex;flex-direction:column;gap:12px;}
  .top-card{
    background:var(--white);border:1px solid var(--line);border-left:4px solid var(--teal);
    border-radius:8px;padding:18px;text-align:left;cursor:pointer;font-family:inherit;
  }
  .top-card h2{font-size:16px;margin:0 0 4px;}
  .top-card p{font-size:13px;color:var(--muted);margin:0;}

  .dash-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px;}
  .dash-box{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:14px;text-align:center;}
  .dash-box .num{font-size:22px;font-weight:700;color:var(--teal);}
  .dash-box .label{font-size:12px;color:var(--muted);margin-top:2px;}

  .list-item{
    background:var(--white);border:1px solid var(--line);border-radius:8px;
    padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .list-item .li-name{font-weight:600;font-size:14px;}
  .list-item .li-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .list-item .li-flag{font-size:11px;color:var(--warn);background:var(--warn-bg);padding:2px 8px;border-radius:999px;flex-shrink:0;}
  .list-item .li-status{font-size:11px;color:var(--teal);background:var(--teal-light);padding:2px 8px;border-radius:999px;flex-shrink:0;}
  .add-btn{
    width:100%;padding:12px;border:1px dashed var(--teal);background:var(--teal-light);
    color:var(--teal);border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:14px;
  }

  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 4px;}
  input[type=text],input[type=tel],input[type=date],input[type=number],textarea,select{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
    font-family:inherit;font-size:14px;box-sizing:border-box;background:#fff;
  }
  textarea{resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .btn{
    padding:11px 18px;border:none;border-radius:8px;font-family:inherit;font-size:14px;
    font-weight:600;cursor:pointer;
  }
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:disabled{background:#A9BBAF;cursor:default;}
  .btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn-danger{background:#fff;border:1px solid #E5A0A0;color:#B91C1C;}
  .btn-row{display:flex;gap:8px;margin-top:18px;}
  .care-toggle{display:flex;align-items:center;gap:8px;margin:14px 0 4px;}
  /*    (2026-10-18) */
  .pl-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .pl-top select{width:auto;flex:0 0 auto}.pl-top input{flex:1;min-width:150px;width:auto}
  .pl-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;color:inherit}
  .pl-chip[aria-pressed="true"]{background:#141A2E;color:#fff;border-color:#141A2E}
  .pl-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .pl-kpi button{background:#F3F4F6;border:2px solid transparent;border-radius:14px;padding:14px;font-family:inherit;color:inherit;text-align:left;cursor:pointer;position:relative}.pl-kpi button.hl{background:#F1F6C7}
  .pl-kpi button::after{content:' ›';position:absolute;top:10px;right:12px;font-size:11px;font-weight:700;color:var(--muted)}
  .pl-kpi button:hover{border-color:#D5D9E0}.pl-kpi button[aria-pressed="true"]{border-color:#141A2E;background:#fff}
  .pl-kpi b{display:block;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}.pl-kpi span{font-size:12px;color:var(--muted)}
  .pl-kpi small{display:block;font-size:11.5px;color:#3D4500;font-weight:700;margin-top:2px}
  .pl-box{border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
  .pl-box h3{margin:0 0 8px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pl-box h3 em{font-style:normal;font-size:11px;background:var(--warn-bg);color:var(--warn);padding:2px 8px;border-radius:999px}
  .pl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 0;border-top:1px dashed var(--line)}.pl-row:first-of-type{border-top:0}
  .pl-row .t{flex:1;min-width:200px;font-size:13.5px}.pl-row .t b{display:block}.pl-row .t span{font-size:12px;color:var(--muted)}
  .pl-row .btn,.pl-exp .btn{padding:8px 12px;font-size:12.5px;min-height:0}
  .pl-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
  .pl-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .pl-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:#F3F4F6;color:var(--muted);white-space:nowrap}
  .pl-tag.s{background:#F1F6C7;color:#3D4500}.pl-tag.r{background:#E7F6EE;color:#1E7A4C}.pl-tag.d{background:#EEF2FB;color:#11308C}
  .pl-exp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  #pl-view{scroll-margin-top:76px}
  .pl-desc{font-size:12.5px;color:var(--muted);margin:0 0 10px;line-height:1.6}
  .pl-note{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#EEF2FB;color:#11308C;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;margin:0 0 10px}
  .pl-note button{margin-left:auto;border:1px solid #11308C;background:#fff;color:#11308C;border-radius:999px;padding:4px 12px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
  .pl-sub{margin:-4px 0 10px 14px;border-left:3px solid #C0D904;padding-left:10px}.pl-sub .list-item{margin-bottom:6px}
  .pl-more{font-size:12px;font-weight:700;color:#3D4500;white-space:nowrap}
  .pl-bars{display:grid;gap:5px;margin:0 0 12px}.pl-bars div{display:grid;grid-template-columns:34px 1fr 30px;gap:8px;align-items:center;font-size:12px}
  .pl-bars i{display:block;height:9px;border-radius:9px;background:#F3F4F6;overflow:hidden}.pl-bars i em{display:block;height:100%;background:#C0D904}
  .pl-voice{display:block}.pl-voice .st{color:#F5A524;font-size:13px;letter-spacing:1px}.pl-voice p{margin:4px 0;font-size:14px;line-height:1.6}
  .pl-tag.w{background:#FDF3E1;color:#9A5B00}.pl-tag.x{background:#FDECEC;color:#B4232A}
  @media (max-width:600px){.pl-kpi{grid-template-columns:repeat(2,1fr)}.pl-kpi button{padding:12px}.pl-kpi b{font-size:22px}.pl-exp{grid-template-columns:1fr 1fr}.list-item .pl-tags{justify-content:flex-start}}
  /*    (2026-10-18) */
  .list-item .li-ci{font-size:11px;font-weight:700;color:#3D4500;background:#F1F6C7;padding:2px 8px;border-radius:999px;flex-shrink:0;}
  .ci-box{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;background:#FBFCF3;}
  .ci-box h4{margin:0 0 6px;font-size:14px;}
  .ci-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--line);}
  .ci-row:first-of-type{border-top:0;}
  .ci-row .ci-l{flex:1;min-width:150px;font-size:13px;}
  .ci-row .ci-l b{display:block;font-size:13.5px;}
  .ci-row .ci-s{font-size:12px;color:var(--muted);}
  .ci-row .btn{padding:7px 11px;font-size:12.5px;min-height:0;}
  .care-toggle input{width:auto;}

  .consult-item{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .consult-item .c-date{font-size:11px;color:var(--muted);margin-bottom:4px;}

  .qr-box{text-align:center;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:20px;margin:14px 0;}
  .qr-box #qr-canvas{display:flex;justify-content:center;margin-bottom:10px;}
  .qr-box .qr-url{font-size:11px;color:var(--muted);word-break:break-all;}
  .survey-count{font-size:13px;color:var(--teal);font-weight:600;margin-top:8px;}

  /* ----    (,  ) ---- */
  .survey-wrap{max-width:420px;margin:0 auto;padding:40px 20px;}
  .survey-wrap h1{font-size:19px;text-align:center;margin-bottom:6px;}
  .survey-wrap p.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:26px;}
  .stars{display:flex;justify-content:center;gap:6px;font-size:30px;margin-bottom:22px;cursor:pointer;}
  .stars span{color:#D8DCD6;transition:color .1s;}
  .stars span.on{color:var(--amber);}
  .survey-done{text-align:center;padding:60px 20px;}
  .survey-wrap .rv-guide{background:#F4F7E4;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#4B5320;margin:0 0 8px;line-height:1.7}
  .survey-wrap .rv-count{text-align:right;font-size:12px;color:var(--muted);margin-top:4px}
  .rv-box{text-align:left;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .rv-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .rv-head b{flex:1;font-size:14px;color:var(--ink)}
  .rv-head .btn{padding:7px 11px;font-size:12.5px}
  .rv-item{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:7px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:keep-all}
  .rv-item small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
  .survey-done .check{font-size:48px;margin-bottom:14px;}

  .setup-card{
    background:var(--white);border:1px solid var(--line);border-left:4px solid var(--teal);
    border-radius:8px;padding:20px 18px;
  }
  .setup-card h3{font-size:16px;margin:0 0 10px;}
  .setup-card p{font-size:13px;color:var(--muted);margin:0 0 14px;}
</style>

function moaDate(v, kind){
  if(v === null || v === undefined || v === '') return '';
  var d;
  if(typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)){ var p = v.split('-'); d = new Date(+p[0], +p[1]-1, +p[2]); }
  else d = new Date(v);
  if(isNaN(d.getTime())) return String(v);
  var y = d.getFullYear(), m = ('0'+(d.getMonth()+1)).slice(-2), dd = ('0'+d.getDate()).slice(-2), w = '(' + ''[d.getDay()] + ')';
  var hm = ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
  if(kind === 'week') return y + '.' + m + '.' + dd + w;
  if(kind === 'short') return m + '.' + dd + w;
  if(kind === 'time') return y + '.' + m + '.' + dd + ' ' + hm;
  if(kind === 'stime') return m + '.' + dd + w + ' ' + hm;
  if(kind === 'ym') return y + '.' + m;
  if(kind === 'formal') return y + ' ' + (d.getMonth()+1) + ' ' + d.getDate() + '';
  return y + '.' + m + '.' + dd;
}

function apiUrl(path){
  const sep = path.includes('?') ? '&' : '?';
  return path + sep + 't=' + encodeURIComponent(TEACHER_ID);
}
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function genId(prefix){ return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

const CHECKINS = [{k:'m6', label:' 6', months:6}, {k:'y1', label:' 1', months:12}];
function isoOf(d){ return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); }
function todayIso(){ return isoOf(new Date()); }
function addMonths(iso, n){ const p = iso.split('-'); return isoOf(new Date(+p[0], +p[1]-1+n, +p[2])); }
function daysUntil(iso){ const p = iso.split('-'), t = new Date(); return Math.round((new Date(+p[0], +p[1]-1, +p[2]) - new Date(t.getFullYear(), t.getMonth(), t.getDate())) / 86400000); }
function checkinList(rec){
  if(!rec || !/^\d{4}-\d{2}-\d{2}$/.test(rec.joinDate || '')) return [];
  const done = rec.checkins || {};
  return CHECKINS.map(c => { const date = addMonths(rec.joinDate, c.months); return Object.assign({}, c, {date, days: daysUntil(date), done: done[c.k] || ''}); });
}
// 7   ,     ( null)
function checkinDue(rec){ return checkinList(rec).find(c => !c.done && c.days <= 7) || null; }
function checkinMsg(name, c){
  const n = name ? name + '' : '';
  if(c.k === 'm6') return n + ',  6 . .\n    .  ?\n ,       .';
  return n + ',  1 . .\n1    .    ?\n      .     .';
}

function bindStars(target){
  document.querySelectorAll('.stars').forEach(starsEl => {
    const field = starsEl.getAttribute('data-field');
    starsEl.querySelectorAll('span').forEach(s => {
      s.addEventListener('click', () => {
        const v = parseInt(s.getAttribute('data-v'), 10);
        target[field] = v;
        starsEl.querySelectorAll('span').forEach(s2 => {
          s2.classList.toggle('on', parseInt(s2.getAttribute('data-v'),10) <= v);
        });
      });
    });
  });
}

function daysRemainingText(expiresAt){
  if(!expiresAt) return '';
  const diff = Math.ceil((expiresAt - Date.now()) / (24 * 60 * 60 * 1000));
  if(diff <= 0) return '';
  return `${diff}  (${moaDate(expiresAt)})`;
}

  const people = list.reduce((s,r) => s + (parseInt(r.participantCount,10) || 0), 0);
  const resp = list.reduce((s,r) => s + ((PL_DATA.survey[r.id] || []).length), 0);
  const all = [].concat(...list.map(r => PL_DATA.survey[r.id] || []));
  const sats = all.map(i => +i.satisfaction).filter(n => n > 0);
  const avg = sats.length ? (sats.reduce((a,b)=>a+b,0) / sats.length).toFixed(1) : '-';
  const renewOrgs = new Set(list.filter(r => r.renewalIntent === '' && !plIsPersonal(r)).map(r => r.orgName));
  return { orgs: orgs.size, total: list.length, upcoming: list.filter(r => (r.date || '') > t).length,
    done: list.filter(r => r.date && r.date <= t).length, people, resp, avg, renew: renewOrgs.size };
}
//  
function plByOrg(list){
  const m = {};
  list.forEach(r => { const k = r.orgName || ' '; (m[k] = m[k] || []).push(r); });
  return Object.keys(m).map(k => {
    const a = m[k].slice().sort((x,y) => (y.date || '').localeCompare(x.date || ''));
    const past = a.filter(r => r.date && r.date <= todayIso());
    const sv = [].concat(...a.map(r => PL_DATA.survey[r.id] || [])).map(i => +i.satisfaction).filter(n => n > 0);
    return { org:k, items:a, last: past[0] || null, people: a.reduce((s,r) => s + (parseInt(r.participantCount,10) || 0), 0),
      avg: sv.length ? (sv.reduce((x,y)=>x+y,0)/sv.length).toFixed(1) : '-', renew: a.some(r => r.renewalIntent === ''),
      contactedAt: a.map(r => r.contactedAt || '').sort().pop() || '' };
  }).sort((x,y) => ((y.last && y.last.date) || '').localeCompare((x.last && x.last.date) || ''));
}
//   :    ·    · (       150) ·  60    
function plRecontact(){
  const t = todayIso();
  return plByOrg(PL_DATA.items).filter(g => {
    if(plIsPersonal(g.items[0]) || !g.last) return false;
    if(g.items.some(r => (r.date || '') > t)) return false;
    if(g.contactedAt && plDaysSince(g.contactedAt.slice(0,10)) < CONTACT_COOLDOWN) return false;
    return g.renew || plDaysSince(g.last.date) >= RECONTACT_DAYS;
  });
}
// · :      
function plCallInfo(g, rcSet){
  const t = todayIso(), next = g.items.filter(r => (r.date || '') > t).map(r => r.date).sort()[0];
  const intent = g.renew ? '' : (g.items.some(r => r.renewalIntent === '') && !g.items.some(r => r.renewalIntent === '') ? '' : '');
  let state, cls = '';
  if(rcSet.has(g.org)){ state = '  '; cls = 'r'; }
  else if(next){ state = moaDate(next) + '   ·    '; cls = 'd'; }
  else if(!g.last){ state = '   '; }
  else if(g.contactedAt && plDaysSince(g.contactedAt.slice(0,10)) < CONTACT_COOLDOWN){
    const back = isoOf(new Date(new Date(g.contactedAt.slice(0,10) + 'T00:00:00').getTime() + CONTACT_COOLDOWN * 86400000));
    state = plDaysSince(g.contactedAt.slice(0,10)) + '   · ' + moaDate(back) + '  ';
  } else {
    const when = isoOf(new Date(new Date(g.last.date + 'T00:00:00').getTime() + RECONTACT_DAYS * 86400000));
    state = moaDate(when) + '   (D-' + Math.max(0, daysUntil(when)) + ')'; cls = 'w';
  }
  return { intent, state, cls };
}
function plSeason(){ const m = new Date().getMonth() + 1; return (m >= 11 || m <= 2) ? '   11~2' : '   '; }
function plMsg(g){
  const r = g.last, who = r.contactPerson ? r.contactPerson + '' : '';
  return who + ', . .\n' +
    moaDate(r.date, 'formal') + ' ' + ((r.programName || '').replace(/\s*\(\)/, '')) + '   .' +
    (g.avg !== '-' ? '   5  ' + g.avg + '.' : '') + '\n' +
    '          .    ?';
}
function plRows(list){
  // ()  
  return list.filter(r => r.date && r.date <= todayIso()).sort((a,b) => (b.date || '').localeCompare(a.date || '')).map(r => {
    const sv = (PL_DATA.survey[r.id] || []).map(i => +i.satisfaction).filter(n => n > 0);
    return { date: r.date || '', org: r.orgName || '', prog: (r.programName || '').replace(/\s*\(\)/, ''), field: r.field || '', hours: r.hours || '',
      people: r.participantCount || '', sat: sv.length ? (sv.reduce((a,b)=>a+b,0)/sv.length).toFixed(1) : '', n: sv.length };
  });
}
function plDownload(name, text, type){
  const blob = new Blob([text], { type }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function plCopy(text, done){
  try{ await navigator.clipboard.writeText(text); alert(done); }catch(e){ prompt('    ', text); }
}

    <div class="btn-row">

      ${id ? '<button class="btn btn-danger" id="delete-program"></button>' : ''}
    </div>

    ${id ? `
      <div class="qr-box">
        ${record.selfEval ? `<div style="font-weight:600;margin-bottom:6px;">①  ·    QR</div>
        <p class="lead" style="margin:0 0 8px;font-size:12px">     . 2, 30 .</p>
        <div id="qr-pre"></div><div class="qr-url" id="qr-pre-url"></div>
        <div style="font-weight:600;margin:16px 0 10px;">②   · · +    QR</div>` : '<div style="font-weight:600;margin-bottom:10px;">·  QR</div>'}
        <div id="qr-canvas"></div>
        <div class="qr-url" id="qr-url"></div>
        <div id="qr-classes"></div>
        <button class="btn btn-primary" id="qr-board" style="margin-top:10px;width:100%">  </button>
        <p class="lead" style="margin:6px 0 0;font-size:12px">    (  ),  ·    .</p>
        <button class="btn btn-outline" id="qr-copy" style="margin-top:8px;padding:7px 12px;font-size:12.5px">  </button>
        <div class="survey-count" id="survey-count">  ...</div>
        <div id="survey-comments"></div>
      </div>
    ` : '<p class="lead">   QR .</p>'}
  `;

  if(id){
    const surveyUrl = location.origin + location.pathname + '?survey=1&t=' + encodeURIComponent(TEACHER_ID) + '&p=' + encodeURIComponent(id) + (record.selfEval ? '&se=1' : '');
    if(record.selfEval){
      const preUrl = surveyUrl + '&stage=pre';
      document.getElementById('qr-pre-url').textContent = preUrl;
      try{ new QRCode(document.getElementById('qr-pre'), { text: preUrl, width:160, height:160, colorDark:'#3D4500', colorLight:'#FFFFFF' }); }catch(err){ console.error(err); }
    }
    document.getElementById('qr-url').textContent = surveyUrl;
    document.getElementById('qr-copy').onclick = async () => {
      try{ await navigator.clipboard.writeText(surveyUrl); alert('  .   "·"  .'); }
      catch(e){ prompt('    ', surveyUrl); }
    };
    //   (2026-10-03):  · →   →  →      
    document.getElementById('qr-board').onclick = () => {
      const v = (k) => { const e = document.getElementById(k); return e ? String(e.value || '').trim() : ''; };
      const q = new URLSearchParams({
        survey: surveyUrl,
        org: v('f-orgName') || record.orgName || '',
        dept: v('f-field') || record.field || '',
        mgr: v('f-contactPerson') || record.contactPerson || '',
        phone: v('f-contactPhone') || record.contactPhone || '',
        subject: v('f-programName') || record.programName || '',
        date: v('f-date') || record.date || '',
        hours: v('f-hours') || record.hours || '',
        n: v('f-participantCount') || record.participantCount || ''
      });
      window.open('https://jinromoa-board.vercel.app/#tracker?' + q.toString(), '_blank');
    };
    const classes = (record.classes || []).filter(Boolean);
    if(classes.length){
      //  QR (2026-10-03):      · 
      document.getElementById('qr-canvas').style.display = 'none';
      document.getElementById('qr-url').style.display = 'none';
      const box = document.getElementById('qr-classes');
      box.innerHTML = '<p class="lead" style="margin:0 0 10px;font-size:12px">   QR  .    .</p>' +
        classes.map((c, i) => `<div style="border:1px solid var(--line,#E6E8EE);border-radius:12px;padding:12px;margin-bottom:10px;text-align:center">
          <div style="font-weight:700;margin-bottom:8px">${escapeHtml(c)}</div><div id="qr-cls-${i}" style="display:inline-block"></div>
          <div><button class="btn btn-outline" data-clscopy="${i}" style="margin-top:8px;padding:6px 12px;font-size:12px">   </button></div></div>`).join('');
      const clsUrl = (c) => surveyUrl + '&s=' + encodeURIComponent(c) + '&sl=' + encodeURIComponent(c) + '&lt=' + encodeURIComponent(record.orgName || '');
      classes.forEach((c, i) => { try{ new QRCode(document.getElementById('qr-cls-' + i), { text: clsUrl(c), width:150, height:150, colorDark:'#3D4500', colorLight:'#FFFFFF' }); }catch(err){ console.error(err); } });
      box.querySelectorAll('[data-clscopy]').forEach(b => b.onclick = async () => {

        try{ await navigator.clipboard.writeText(u); alert('    .'); }catch(e){ prompt('    ', u); }
      });
    } else {
      try{
        new QRCode(document.getElementById('qr-canvas'), {
          text: surveyUrl, width:160, height:160, colorDark:'#3D4500', colorLight:'#FFFFFF'
        });
      }catch(err){ console.error(err); }
    }
    loadSurveyStats(id);
  }

  document.getElementById('save-program').onclick = async () => {
    const btn = document.getElementById('save-program');
    btn.disabled = true; btn.textContent = ' ...';
    const payload = {
      id: record.id || genId('prog'),
      orgName: document.getElementById('f-orgName').value.trim(),
      field: document.getElementById('f-field').value.trim(),
      contactPerson: document.getElementById('f-contactPerson').value.trim(),
      contactPhone: document.getElementById('f-contactPhone').value.trim(),

      hours: document.getElementById('f-hours').value,
      participantCount: document.getElementById('f-participantCount').value,
      classes: document.getElementById('f-classes').value.split(/[,]/).map(x => x.replace(/[<>]/g, '').trim().slice(0, 20)).filter(Boolean).slice(0, 20),
      renewalIntent: document.getElementById('f-renewalIntent').value,
      feedbackNotes: document.getElementById('f-feedbackNotes').value.trim(),
      proposalNotes: document.getElementById('f-proposalNotes').value.trim(),
      selfEval: document.getElementById('f-selfEval').checked,
      avgSatisfaction: record.avgSatisfaction || '',

      updatedAt: new Date().toISOString()
    };
    if(!payload.orgName || !payload.programName){ alert('   .'); btn.disabled=false; btn.textContent=''; return; }
    try{
      const res = await fetch(apiUrl('/api/programs'), {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
      });
      const data = await res.json();
      renderProgramDetail(payload.id);
    }catch(err){
      console.error(err);
      alert('   .');
      btn.disabled = false; btn.textContent = '';
    }
  };

  if(id){
    document.getElementById('delete-program').onclick = async () => {
      if(!confirm(' ?     .')) return;
      try{
        await fetch(apiUrl('/api/programs?id=' + encodeURIComponent(id)), { method:'DELETE' });
        renderProgramList();
      }catch(err){ console.error(err); alert('   .'); }
    };
  }
}

function renderReviews(items, programId){
  const box = document.getElementById('survey-comments');
  if(!box) return;
  const list = items.filter(i => (i.comment||'').trim());
  if(!list.length){ box.innerHTML = '<div class="rv-box"><p class="lead" style="margin:0">   .</p></div>'; return; }
  let shown = 10;
  const fmt = (d) => moaDate(d, 'time');
  const draw = () => {
    box.innerHTML = '<div class="rv-box"><div class="rv-head"><b>  ' + list.length + '</b>' +
      '<button class="btn btn-outline" id="rv-copy"> </button><button class="btn btn-outline" id="rv-csv">(CSV)</button></div>' +
      list.slice(0, shown).map(i => '<div class="rv-item"><small>' + (i.slot ? escapeHtml(i.slot) + ' · ' : '') + fmt(i.submittedAt) + ' ·  ' + (i.satisfaction||'-') + '</small>' + escapeHtml(i.comment.trim()) + '</div>').join('') +
      (list.length > shown ? '<button class="btn btn-outline" id="rv-more" style="width:100%">  (' + (list.length - shown) + ')</button>' : '') +
      '<p class="lead" style="margin:8px 0 0;font-size:12px">     "  "     .</p></div>';
    document.getElementById('rv-copy').onclick = async () => {
      const txt = list.map(i => i.comment.trim().replace(/\s*\n+\s*/g, ' ')).join('\n');
      try{ await navigator.clipboard.writeText(txt); alert(' ' + list.length + ' .'); }
      catch(e){ prompt('    ', txt); }
    };
    document.getElementById('rv-csv').onclick = () => {
      const q = (x) => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"';
      const rows = [['','','','','',''].map(q).join(',')].concat(
        items.map(i => [i.submittedAt, i.slot || '', i.satisfaction, i.attitude, i.helpfulness, (i.comment||'').trim()].map(q).join(',')));
      const blob = new Blob(['\uFEFF' + rows.join('\r\n')], { type:'text/csv' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '_' + programId + '.csv'; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    };
    const more = document.getElementById('rv-more');
    if(more) more.onclick = () => { shown += 20; draw(); };
  };
  draw();
}

async function loadSurveyStats(programId){
  try{
    const res = await fetch(apiUrl('/api/survey?p=' + encodeURIComponent(programId) + '&list=1'));
    const data = await res.json();
    const all = data.items || [];
    const pre = all.filter(i => i.stage === 'pre');
    const items = all.filter(i => i.stage !== 'pre'); //      
    const el = document.getElementById('survey-count');
    if(!el) return;
    if(items.length === 0){
      el.textContent = pre.length ? '   ' + pre.length + '  ·    .' : '  .';
      return;
    }
    const avg = (key) => (items.reduce((s,i)=>s+(i[key]||0),0) / items.length).toFixed(1);
    const sAvg = (arr, k) => { const v = arr.map(i => +i[k]).filter(n => n > 0); return v.length ? (v.reduce((a,b)=>a+b,0)/v.length).toFixed(1) : '-'; };
    el.innerHTML = ` ${items.length} ·   ${avg('satisfaction')} / 5.0` +
      ((pre.length || items.some(i => i.conf1)) ? `<br> ·   ${sAvg(pre,'conf1')} → ${sAvg(items,'conf1')} ·   ${sAvg(pre,'conf2')} → ${sAvg(items,'conf2')} ( ${pre.length})` : '');
    //   (2026-10-03)
    const bySlot = {};
    items.forEach(i => { const k = i.slot || ' '; (bySlot[k] = bySlot[k] || []).push(i); });
    const keys = Object.keys(bySlot);
    if(keys.length > 1 || (keys.length === 1 && keys[0] !== ' ')){
      el.innerHTML += '<div style="margin-top:8px;font-weight:400">' + keys.map(k => {
        const a = bySlot[k], m = (a.reduce((s,i)=>s+(i.satisfaction||0),0) / a.length);
        return '<div>' + escapeHtml(k) + ' ·  ' + a.length + ' ·  <b' + (m < 4 ? ' style="color:#B54708"' : '') + '>' + m.toFixed(1) + '</b></div>';
      }).join('') + '</div>';
    }
    renderReviews(items, programId);

    //       (  )
    try{
      const progRes = await fetch(apiUrl('/api/programs?id=' + encodeURIComponent(programId)));
      const progData = await progRes.json();
      if(progData.record){
        progData.record.avgSatisfaction = avg('satisfaction');
        await fetch(apiUrl('/api/programs'), {
          method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(progData.record)
        });
      }
    }catch(e){ console.error(e); }
  }catch(err){
    console.error(err);
    const el = document.getElementById('survey-count');
    if(el) el.textContent = '   .';
  }
}

/* ---- Init ---- */
(async function init(){
  if(IS_SURVEY){
    if(TEACHER_ID && await isTeacherBlocked(TEACHER_ID)){ renderBlockedNotice(false); return; }
    renderSurveyScreen();
    return;
  }
  if(params.get('master') === '1'){
    document.getElementById('role-badge').textContent = '';
    renderMasterTeacherList();
    return;
  }
  if(!TEACHER_ID){ renderTeacherSetup(); return; }
  if(await isTeacherBlocked(TEACHER_ID)){ renderBlockedNotice(true); return; }
  document.getElementById('role-badge').textContent = ' · ' + TEACHER_ID;
  history.replaceState({screen:'home'}, '');
  renderHome();
})();

window.addEventListener('popstate', (e) => {
  if(IS_SURVEY || IS_BLOCKED) return;
  const state = e.state || { screen:'home' };
  if(state.screen === 'students') renderStudentList();
  else if(state.screen === 'programs') renderProgramList();
  else renderHome();
});
